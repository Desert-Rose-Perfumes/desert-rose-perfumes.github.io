  :root{
    color-scheme:dark;
    /* Skala pisma: pola formularzy mają --fs-m (16 px), bo mniejsze pismo powiększa stronę na iOS. */
    --fs-s:13px; --fs-b:15px; --fs-m:16px; --fs-l:19px; --fs-xl:23px;
    --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    /* Cinzel tylko w nazwie marki. Dane, przyciski i nagłówki – pismo systemowe, czytelne na telefonie. */
    --font-display:"Cinzel",Georgia,"Times New Roman",serif;
    /* Czarna laka z logo: płaskie powierzchnie, cienkie neutralne krawędzie. Złoto (folia) tylko tam, gdzie coś znaczy:
       nazwa marki, główny przycisk, aktywna zakładka, wybrane opcje, fokus i wstążka wyniku. */
    --lacquer-0:#050404; --lacquer-1:#0B0907; --lacquer-2:#15120E; --lacquer-3:#1E1A14; --field:#0F0D0A;
    --foil-hi:#EBD49C; --foil:#D3AF66; --foil-mid:#B58E48; --foil-lo:#7C5D29;
    --on-foil:#1B1408; --ink:#F1E9DA; --muted:#B0A38B; --line:rgba(241,233,218,.10); --line-strong:rgba(241,233,218,.20);
    --ok:#7FD0A3; --warn:#E0B062; --direct:#6CC79A; --radius:12px;
  }
  *{box-sizing:border-box}
  /* Przy przewijaniu do pola lub wyniku zostaje miejsce na przyklejony pasek zakładek. */
  html{background:var(--lacquer-1);scrollbar-color:var(--foil-lo) var(--lacquer-1);scroll-padding-top:72px}
  body{margin:0;min-height:100vh;color:var(--ink);background:var(--lacquer-1);font:var(--fs-m)/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  ::selection{background:var(--foil);color:var(--on-foil)}
  :focus-visible{outline:2px solid var(--foil);outline-offset:2px}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px}

  /* Nagłówek marki przewija się razem ze stroną; przyklejony jest tylko niski pasek zakładek. */
  .masthead{padding:14px 0 12px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .masthead .wrap{display:flex;align-items:center;gap:12px}
  .masthead .logo{width:48px;height:48px;border-radius:50%;flex:none}
  .masthead .brand{flex:1;min-width:0}
  .masthead h1{margin:0;font:600 var(--fs-xl)/1.1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--foil)}
  .masthead .sub{font-size:var(--fs-s);color:var(--muted);margin-top:2px}
  .lang{display:flex;flex:none;gap:2px;padding:3px;border-radius:9px;border:1px solid var(--line)}
  .lang button{border:0;background:none;color:var(--muted);font:600 var(--fs-s)/1 var(--font-ui);padding:7px 10px;border-radius:6px;cursor:pointer}
  .lang button.on{color:var(--ink);background:var(--lacquer-3)}
  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--lacquer-1);border-bottom:1px solid var(--line)}
  nav.tabs .wrap{display:flex;gap:4px}
  nav.tabs button{position:relative;flex:none;background:none;border:0;color:var(--muted);padding:13px 14px;font:600 var(--fs-b)/1.2 var(--font-ui);cursor:pointer;white-space:nowrap;transition:color .15s}
  nav.tabs button:first-child{margin-left:-14px}
  nav.tabs button.active{color:var(--ink)}
  nav.tabs button.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;border-radius:2px;background:var(--foil)}

  main{max-width:1000px;margin:0 auto;padding:18px 16px 64px}
  section.tab{display:none}
  section.tab.active{display:block}
  .card,.result,.modal{background:var(--lacquer-2);border:1px solid var(--line);border-radius:var(--radius)}
  .card{padding:18px;margin-bottom:14px}
  .card h2{margin:0;font-size:var(--fs-l);font-weight:650;line-height:1.3;text-wrap:balance}
  .card p{margin:10px 0 0}
  .eyebrow{font-size:var(--fs-s);font-weight:600;color:var(--muted);margin-bottom:4px}
  .card .meta-line{font-size:var(--fs-s);color:var(--muted);margin-top:2px}

  /* Nagłówek grupy wyników: tytuł, liczba i jedno zdanie, czym ta grupa jest. */
  .sec{margin:26px 2px 10px}
  .sec h3{margin:0;font-size:var(--fs-b);font-weight:650;line-height:1.35}
  .sec h3 .n{color:var(--muted);font-weight:500;margin-left:6px;font-variant-numeric:tabular-nums}
  .sec p{margin:2px 0 0;font-size:var(--fs-s);color:var(--muted)}
  .modal .sec{margin:22px 0 8px}

  label.lbl{display:block;font-size:var(--fs-s);color:var(--muted);margin:14px 0 6px;font-weight:600}
  input[type=text],input[type=search],select{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--line-strong);border-radius:10px;font:var(--fs-m) var(--font-ui);color:var(--ink);caret-color:var(--foil-hi);background:var(--field);transition:border-color .15s}
  input::placeholder{color:#968A73}
  input[type=text]:focus,input[type=search]:focus,select:focus{border-color:var(--foil-mid)}
  input[type=text]:focus-visible,input[type=search]:focus-visible,select:focus-visible{outline:2px solid var(--foil);outline-offset:1px}
  input[type=checkbox]{accent-color:var(--foil)}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px;align-items:end}
  .actions{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-top:16px}
  .toggle{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
  .toggle input{width:20px;height:20px;flex:none;margin:0}
  .fields .toggle{margin-bottom:1px}

  /* Główny przycisk: płaska złota płytka, zwykłe pismo. */
  button.primary{min-height:46px;padding:12px 24px;border:0;border-radius:10px;cursor:pointer;color:var(--on-foil);background:var(--foil);font:650 var(--fs-b)/1.2 var(--font-ui);transition:background-color .15s}
  button.primary:active{background:var(--foil-mid)}
  .btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:8px;background:none;color:var(--ink);font:600 var(--fs-s)/1.2 var(--font-ui);cursor:pointer;transition:border-color .15s,color .15s}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{display:inline-flex;align-items:center;min-height:36px;border:1px solid var(--line-strong);background:none;color:var(--ink);border-radius:999px;padding:7px 13px;font:500 var(--fs-s)/1.2 var(--font-ui);cursor:pointer;user-select:none;transition:border-color .15s,background-color .15s}
  .chip.on{background:rgba(211,175,102,.14);border-color:var(--foil-mid);color:var(--foil-hi)}
  .chip.unavail{color:var(--muted);border-style:dashed}
  .chip.note,.chip.small{min-height:0;padding:5px 11px;cursor:default;border-color:transparent;background:rgba(241,233,218,.07)}

  /* Wynik: nazwa i podobieństwo, uzasadnienie, inspiracja, dostępność i szczegóły.
     Wstążka z lewej mówi, czym jest wynik: złota – podobny profil, zielona – inspirowany bezpośrednio (potwierdzone przez właściciela). */
  .result{position:relative;padding:16px 18px 14px 20px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}
  .result::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--foil-mid)}
  .result.direct::before{background:var(--direct)}
  .result:focus-within{border-color:var(--foil-mid)}
  .r-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
  .r-id{min-width:0}
  .result .name{margin:0;font-size:var(--fs-m);font-weight:650;line-height:1.3;letter-spacing:.01em;overflow-wrap:anywhere}
  .result .brand{color:var(--muted);font-size:var(--fs-s);margin-top:2px}
  .r-score{flex:none;text-align:right;line-height:1.1}
  .r-score .pct{display:block;font-size:var(--fs-l);font-weight:700;color:var(--foil);font-variant-numeric:tabular-nums}
  .r-score .lbl{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .tag-direct{flex:none;font-size:12px;font-weight:650;line-height:1.2;color:var(--direct);border:1px solid rgba(108,199,154,.45);border-radius:999px;padding:4px 9px;white-space:nowrap}
  .why{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;margin:12px 0 0;font-size:var(--fs-b)}
  .why dt{color:var(--muted);font-size:var(--fs-s);font-weight:600;padding-top:2px}
  .why dd{margin:0;min-width:0}
  .r-note{margin:8px 0 0;font-size:var(--fs-s);color:var(--muted)}
  .insp{margin:10px 0 0;font-size:var(--fs-s);color:var(--muted)}
  .insp b{color:var(--ink);font-weight:600}
  .r-foot{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .r-foot{flex-wrap:wrap}
  .r-foot .insp{flex:1;min-width:0;margin:0}
  .conf{white-space:nowrap}
  .conf-inline::before{content:" · "}
  .more::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:1.5px 1.5px 0 0;transform:rotate(45deg);margin-left:2px}
  .pcard{margin:0;display:flex;flex-direction:column}
  .pcard .r-foot{margin-top:auto}
  .pcard .facts{margin:8px 0 12px;font-size:var(--fs-s);color:var(--muted)}
  .pcard .facts div+div{margin-top:2px}
  .stock{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-s);font-weight:650;color:var(--ok)}
  .stock::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
  .stock.out{color:var(--warn)}
  .conf.high{color:var(--foil)}

  /* Skale 1–5: pięć odcinków, liczba i słowo – czytelne bez legendy. */
  .scales{display:grid;grid-template-columns:max-content max-content 1fr;gap:8px 14px;align-items:center;font-size:var(--fs-s);margin-top:14px}
  .scales .s-l{color:var(--muted);font-weight:600}
  .scales .s-v{color:var(--ink)}
  .meter{display:flex;gap:3px}
  .meter i{width:16px;height:6px;border-radius:2px;background:rgba(241,233,218,.13)}
  .meter i.on{background:var(--foil)}
  /* Piramida nut: etykieta grupy w kolumnie, nuty pełnym pismem. */
  .pyr{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin-top:12px;font-size:var(--fs-b)}
  .pyr b{color:var(--muted);font-weight:600;font-size:var(--fs-s);padding-top:2px}
  .muted{color:var(--muted)}
  .small{font-size:var(--fs-s);font-weight:400}
  .empty{padding:20px 18px;color:var(--muted)}
  .empty .empty-t{display:block;color:var(--ink);font-weight:650;margin-bottom:4px}
  .empty .btn{margin-top:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .hint{font-size:var(--fs-s);color:var(--muted);margin-top:12px}
  .count{font-size:var(--fs-s);color:var(--muted);margin:6px 2px 10px}

  .modal-bg{position:fixed;inset:0;display:none;z-index:50;overflow-y:auto;padding:14px;background:rgba(3,2,2,.82)}
  .modal-bg.open{display:block}
  .modal{max-width:760px;margin:0 auto;padding:22px;position:relative}
  .modal .close{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:var(--lacquer-1);cursor:pointer;transition:border-color .15s}
  .modal .close::before,.modal .close::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1.5px;background:var(--ink);transform:translate(-50%,-50%) rotate(45deg)}
  .modal .close::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .modal h2{margin:0 48px 2px 0;font-size:var(--fs-xl);font-weight:650;line-height:1.2;letter-spacing:.01em}
  .modal .brand{color:var(--muted);font-size:var(--fs-s)}
  .modal .meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:var(--fs-s);color:var(--muted);margin-top:10px}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin-top:16px;font-size:var(--fs-b)}
  .kv b{color:var(--muted);font-weight:600;font-size:var(--fs-s);padding-top:2px}

  /* Hover tylko przy kursorze: na ekranie dotykowym stan zostaje po stuknięciu. */
  @media (hover:hover){
    .lang button:hover{color:var(--ink)}
    nav.tabs button:hover{color:var(--ink)}
    input[type=text]:hover,input[type=search]:hover,select:hover{border-color:rgba(241,233,218,.32)}
    button.primary:hover{background:var(--foil-hi)}
    .btn:hover{border-color:var(--foil-mid);color:var(--foil-hi)}
    .chip:hover{border-color:rgba(211,175,102,.55)}
    .chip.note:hover,.chip.small:hover{border-color:transparent}
    .result:hover{border-color:rgba(211,175,102,.32)}
    .modal .close:hover{border-color:var(--foil)}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
  @media (max-width:480px){ .fields.stack-narrow{grid-template-columns:1fr} }
  @media (max-width:600px){
    .masthead{padding-bottom:8px}
    .masthead .logo{width:40px;height:40px}
    .masthead h1{font-size:var(--fs-l);letter-spacing:.1em}
    nav.tabs button{flex:1 1 0;padding:13px 6px;text-align:center}
    nav.tabs button:first-child{margin-left:0}
    nav.tabs button.active::after{left:10%;right:10%}
    .card{padding:16px}
    .result{padding:14px 14px 12px 17px}
    .actions{flex-direction:column;align-items:stretch}
    /* Telefon: etykieta uzasadnienia nad wartością, znacznik inspiracji nad nazwą, inspiracja w osobnym wierszu stopki. */
    .why{grid-template-columns:1fr;gap:0}
    .why dt{margin-top:8px}
    .why dt:first-child{margin-top:0}
    .r-head{flex-wrap:wrap;gap:8px 14px}
    .tag-direct{order:-1}
    .direct .r-id{flex-basis:100%}
    .r-foot .insp{order:-1;flex-basis:100%}
    .conf-inline{display:block}
    .conf-inline::before{content:none}
    button.primary{width:100%}
    .modal-bg{padding:8px}
    .modal{padding:18px 16px}
  }
</style>
</head>

<main>
  <!-- ODPOWIEDNIK -->
  <section class="tab active" id="tab-odp">
    <div class="card">
      <h2 data-en="Find the Arabic equivalent of a well-known fragrance">Znajdź arabski odpowiednik znanego zapachu</h2>
      <label class="lbl" for="refInput" data-en="Designer / niche fragrance (e.g. Fahrenheit, Sauvage, Baccarat Rouge, Good Girl)">Zapach projektancki / niszowy (np. Fahrenheit, Sauvage, Baccarat Rouge, Good Girl)</label>
      <input type="search" id="refInput" list="refList" placeholder="Wpisz nazwę…" data-en-ph="Type a name…" autocomplete="off">
      <datalist id="refList"></datalist>
      <div class="fields stack-narrow">
        <div>
          <label class="lbl" for="refCount" data-en="Number of suggestions">Liczba propozycji</label>
          <select id="refCount"><option>3</option><option selected>5</option><option>8</option><option>12</option></select>
        </div>
        <div>
          <label class="lbl" for="refGender" data-en="For whom">Dla kogo</label>
          <select id="refGender"><option value="" data-en="Same as the original">Jak oryginał</option><option value="*" data-en="Anyone">Dowolnie</option><option value="K" data-en="For her">Dla niej</option><option value="M" data-en="For him">Dla niego</option><option value="U">Unisex</option></select>
        </div>
      </div>
      <div class="actions">
        <label class="toggle"><input type="checkbox" id="refStock"> <span data-en="Only items in stock">Tylko dostępne od ręki</span></label>
        <button type="button" class="primary" id="refGo" data-en="Find similar">Znajdź podobne</button>
      </div>
      <div class="hint" data-en="Can't find the name? Type notes instead, e.g. “vanilla, tonka, coffee” or “leather, violet, vetiver” – the advisor builds a profile from the notes.">Nie ma nazwy na liście? Wpisz zamiast niej nuty, np. „wanilia, tonka, kawa” albo „leather, violet, vetiver” – doradca zbuduje profil z nut.</div>
    </div>
    <div id="refOut"></div>
  </section>

  <!-- DORADCA -->
  <section class="tab" id="tab-dor">
    <div class="card">
      <h2 data-en="Find a fragrance that suits you">Dobierz zapach dla siebie</h2>
      <label class="lbl" data-en="For whom">Dla kogo</label>
      <div class="chips" role="group" id="dGender" data-single>
        <button type="button" class="chip on" data-v="*" data-en="Anyone" aria-pressed="true">Dowolnie</button><button type="button" class="chip" data-v="K" data-en="For her" aria-pressed="false">Dla niej</button><button type="button" class="chip" data-v="M" data-en="For him" aria-pressed="false">Dla niego</button><button type="button" class="chip" data-v="U" aria-pressed="false">Unisex</button>
      </div>
      <label class="lbl" data-en="Sweetness">Słodycz</label>
      <div class="chips" role="group" id="dSweet" data-single>
        <button type="button" class="chip on" data-v="" data-en="Any" aria-pressed="true">Dowolna</button><button type="button" class="chip" data-v="1-2" data-en="Dry" aria-pressed="false">Wytrawny</button><button type="button" class="chip" data-v="2-3" data-en="Slightly sweet" aria-pressed="false">Lekko słodki</button><button type="button" class="chip" data-v="3-4" data-en="Sweet, but not too sweet" aria-pressed="false">Słodki, ale nie za słodki</button><button type="button" class="chip" data-v="4-5" data-en="Very sweet" aria-pressed="false">Bardzo słodki</button>
      </div>
      <label class="lbl" data-en="Freshness">Świeżość</label>
      <div class="chips" role="group" id="dFresh" data-single>
        <button type="button" class="chip on" data-v="" data-en="Any" aria-pressed="true">Dowolna</button><button type="button" class="chip" data-v="1-2" data-en="Warm, enveloping" aria-pressed="false">Ciepły, otulający</button><button type="button" class="chip" data-v="2-3" data-en="Balanced" aria-pressed="false">Zbalansowany</button><button type="button" class="chip" data-v="3-4" data-en="Rather fresh" aria-pressed="false">Raczej świeży</button><button type="button" class="chip" data-v="4-5" data-en="Very fresh" aria-pressed="false">Bardzo świeży</button>
      </div>
      <label class="lbl" data-en="Character / weight">Charakter / ciężkość</label>
      <div class="chips" role="group" id="dHeavy" data-single>
        <button type="button" class="chip on" data-v="" data-en="Any" aria-pressed="true">Dowolny</button><button type="button" class="chip" data-v="1-2" data-en="Light, discreet" aria-pressed="false">Lekki, dyskretny</button><button type="button" class="chip" data-v="2-3" data-en="Medium" aria-pressed="false">Średni</button><button type="button" class="chip" data-v="3-4" data-en="Bold" aria-pressed="false">Wyrazisty</button><button type="button" class="chip" data-v="4-5" data-en="Heavy, evening" aria-pressed="false">Ciężki, wieczorowy</button>
      </div>
      <label class="lbl" data-en="Occasion (pick any)">Okazja (można kilka)</label>
      <div class="chips" role="group" id="dOcc">
        <button type="button" class="chip" data-v="dzien" data-en="Everyday / work" aria-pressed="false">Na co dzień / praca</button><button type="button" class="chip" data-v="wieczor" data-en="Evening / date" aria-pressed="false">Wieczór / randka</button><button type="button" class="chip" data-v="impreza" data-en="Party" aria-pressed="false">Impreza</button><button type="button" class="chip" data-v="specjalna" data-en="Special occasion" aria-pressed="false">Specjalna okazja</button><button type="button" class="chip" data-v="wakacje" data-en="Holiday" aria-pressed="false">Wakacje</button>
      </div>
      <label class="lbl" data-en="Season (pick any)">Pora roku (można kilka)</label>
      <div class="chips" role="group" id="dSeason">
        <button type="button" class="chip" data-v="wiosna" data-en="Spring" aria-pressed="false">Wiosna</button><button type="button" class="chip" data-v="lato" data-en="Summer" aria-pressed="false">Lato</button><button type="button" class="chip" data-v="jesien" data-en="Autumn" aria-pressed="false">Jesień</button><button type="button" class="chip" data-v="zima" data-en="Winter" aria-pressed="false">Zima</button>
      </div>
      <label class="lbl" for="dLike" data-en="Notes I like (type comma-separated or tap)">Lubię nuty (wpisz po przecinku lub kliknij)</label>
      <input type="text" id="dLike" placeholder="np. wanilia, pistacja, kawa" data-en-ph="e.g. vanilla, pistachio, coffee">
      <div class="chips" id="dLikeChips"></div>
      <label class="lbl" for="dDislike" data-en="Notes I don't like (excluded)">Nie lubię nut (wykluczamy)</label>
      <input type="text" id="dDislike" placeholder="np. oud, paczula, kokos" data-en-ph="e.g. oud, patchouli, coconut">
      <div class="chips" id="dDislikeChips"></div>
      <div class="fields">
        <div>
          <label class="lbl" for="dCount" data-en="Number of suggestions">Liczba propozycji</label>
          <select id="dCount"><option>3</option><option selected>5</option><option>8</option><option>12</option></select>
        </div>
        <div>
          <label class="toggle"><input type="checkbox" id="dStock"> <span data-en="Only items in stock">Tylko dostępne od ręki</span></label>
        </div>
      </div>
      <div class="actions">
        <span></span>
        <button type="button" class="primary" id="dGo" data-en="Show suggestions">Pokaż propozycje</button>
      </div>
    </div>
    <div id="dOut"></div>
  </section>

  <!-- KATALOG / SZUKAJ -->
  <section class="tab" id="tab-szu">
    <div class="card">
      <h2 data-en="Catalog and search">Katalog i wyszukiwarka</h2>
      <label class="lbl" for="sInput" data-en="Name, brand, inspiration or note">Nazwa, marka, inspiracja albo nuta</label>
      <input type="search" id="sInput" placeholder="np. truskawk, Lattafa, Good Girl" data-en-ph="e.g. strawberry, Lattafa, Good Girl">
      <div class="fields">
        <div>
          <label class="lbl" for="sGender" data-en="Gender">Płeć</label>
          <select id="sGender"><option value="*" data-en="All">Wszystkie</option><option value="K" data-en="Women's">Damskie</option><option value="M" data-en="Men's">Męskie</option><option value="U">Unisex</option></select>
        </div>
        <div>
          <label class="lbl" for="sBrand" data-en="Brand">Marka</label>
          <select id="sBrand"><option value="" data-en="All">Wszystkie</option></select>
        </div>
        <div>
          <label class="lbl" for="sSort" data-en="Sort by">Sortowanie</label>
          <select id="sSort"><option value="stock" data-en="In stock first" selected>Najpierw dostępne</option><option value="name" data-en="Name A–Z">Nazwa A–Z</option><option value="sweet" data-en="Sweetness">Słodycz</option><option value="fresh" data-en="Freshness">Świeżość</option><option value="heavy" data-en="Weight">Ciężkość</option></select>
        </div>
        <label class="toggle"><input type="checkbox" id="sStock"> <span data-en="Only items in stock">Tylko dostępne od ręki</span></label>
      </div>
    </div>
    <div class="count" id="sCount"></div>
    <div id="sOut" class="grid"></div>
  </section>

<script>
(function(){

  const P = DATA.perfumy, R = DATA.referencje, NOTES = DATA.nuty, FAM = DATA.rodziny, FAM_EN = DATA.rodziny_en || {};
  const $ = (s, el) => (el||document).querySelector(s);

  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- język (PL / EN) ----------
  // Kolejność: #pl / #en w adresie, zapamiętany wybór, język przeglądarki. Przełącznik przeładowuje stronę – każdy tekst powstaje raz.
  // Teksty stałe: polski w HTML, angielski w data-en; teksty składane w kodzie: T('polski', 'english').
  const LANG = (()=>{
    const h = location.hash.slice(1); if (h==='pl' || h==='en') return h;
    try { const s = localStorage.getItem('lang'); if (s==='pl' || s==='en') return s; } catch (e) {}
    return /^pl/i.test(navigator.language||'pl') ? 'pl' : 'en';
  })();
  const EN = LANG==='en';
  const T = (pl, en) => EN ? en : pl;
  document.documentElement.lang = LANG;
  if (EN){
    document.title = 'Desert Rose – Fragrance Advisor';
    $$('[data-en]').forEach(el=>{ el.textContent = el.dataset.en; });
    $$('[data-en-ph]').forEach(el=>{ el.placeholder = el.dataset.enPh; });
    $('nav.tabs').setAttribute('aria-label','Sections'); $('#lang').setAttribute('aria-label','Language');
  }
  $$('#lang button').forEach(b=>{
    b.classList.toggle('on', b.dataset.lang===LANG);
    b.addEventListener('click', ()=>{ if (b.dataset.lang===LANG) return; try { localStorage.setItem('lang', b.dataset.lang); } catch (e) {} location.hash = b.dataset.lang; location.reload(); });
  });

  function fold(s){
    return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l').replace(/Ł/g,'l').replace(/[’‘]/g,"'").toLowerCase().replace(/\s+/g,' ').trim();

  // Rdzenie nut: [stem, id], najdłuższe najpierw (ta sama reguła co tools/notes.py).
  const STEMS = [];
  for (const [id, n] of Object.entries(NOTES)) for (const s of n.syn) STEMS.push([s, id]);
  STEMS.sort((a,b)=>b[0].length-a[0].length || (a[0]<b[0]?-1:a[0]>b[0]?1:0) || (a[1]<b[1]?-1:1));

    }
    // Nuty ogólne ("słodki", "drzewny") pomijamy, gdy fragment ma nutę konkretną ("słodka pomarańcza" → pomarańcza).
    return found.some(id=>!NOTES[id].gen) ? found.filter(id=>!NOTES[id].gen) : found;
  }
  function parseNotes(text){
    const ids = [];
    for (const raw of String(text||'').replace(/\([^)]*\)/g,' ').split(/[,;\/\n•|]| i | oraz | and | & /)){
      for (const id of matchToken(raw)) if (!ids.includes(id)) ids.push(id);
    }
    return ids;
  }
  const noteName = id => { const n = NOTES[id]||{}; return (EN ? n.en : n.pl) || id; };
  const famName = f => ((EN && FAM_EN[f]) || FAM[f] || f).split(',')[0];

  // ---------- teksty z danych w wybranym języku ----------
  // Po angielsku: nuty i rodziny ze słownika, okazje i pory roku z PHR, inspiracja z pola inspiracja_en (data/translations_en.json).
  const PHR = {'wieczor':'evening','specjalna okazja':'special occasion','randka':'date night','impreza':'party','dzien':'daytime','na co dzien':'everyday','praca':'work','wakacje':'holiday','casual':'casual','wyjscie':'going out','eleganckie wyjscie':'elegant night out','spotkanie':'meeting','cozy':'cosy','uniwersalny':'versatile','layering':'layering','okazja':'occasion','zaleznie od wersji':'depends on the version','formalne okazje':'formal occasions','elegancki casual':'smart casual','slub':'wedding','uroczystosc':'celebration','eleganckie spotkanie':'elegant meeting','brunch':'brunch',
    'jesien':'autumn','zima':'winter','wiosna':'spring','lato':'summer','caly rok':'all year','najlepiej jesien':'best in autumn','wczesna jesien':'early autumn','chlodna wiosna':'cool spring','szczegolnie jesien i zima':'especially autumn and winter','lagodna zima':'mild winter','szczegolnie wiosna i jesien':'especially spring and autumn'};
  const listText = (tokens, pl) => EN ? tokens.map(t=>PHR[fold(t)]||t).join('; ') : pl;
  const famTop = (p, sep) => Object.entries(p.rodziny).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([f])=>famName(f)).join(sep||' / ');
  // „Brak danych o inspiracji…” (pozycje opisane z listingów sklepów) to nie to samo co własna kompozycja.
  const noInsp = p => /^brak danych/i.test(p.inspiracja);
  const inspText = p => noInsp(p) ? T('nie podano','not stated') : ((EN && p.inspiracja_en) || p.inspiracja);
  const rodzina = p => EN ? (famTop(p) || '—') : (p.rodzina || '—');
  const akordy = p => EN ? (p.nuty_ids.akordy.map(noteName).join(', ') || famTop(p, ', ') || '—') : (p.akordy || '—');
  function pyramid(p){
    const lvl = (k, pl) => EN ? (p.nuty_ids[k].map(noteName).join(', ') || '—') : (pl || '—');
    return [[T('Głowa','Top'), lvl('glowa',p.nuty_glowy)], [T('Serce','Heart'), lvl('serce',p.nuty_serca)], [T('Baza','Base'), lvl('baza',p.nuty_bazy)]];
  }
  const GENDER_EN = {K:"Women's", M:"Men's", U:'Unisex'};
  const genderLabel = p => EN ? (GENDER_EN[p.plec_kod] || 'Not determined') : (p.plec || ({K:'Damski',M:'Męski',U:'Unisex'}[p.plec_kod]||''));

  // ---------- podobieństwo ----------
  // IDF nut: nuty rzadkie (szafran, pistacja) ważą więcej niż wszechobecne (piżmo, wanilia).
  // Nuty ogólne (gen: „drzewny”, „słodki”) nie liczą się do wspólnych nut – wchodzą tylko do rodzin akordów.
  // Rodziny akordów: pierwiastek tłumi dominację jednej rodziny (5 nut drzewnych ≠ 5× bardziej drzewny).
  // Ta sama formuła jest w tools/eval_similarity.py – po zmianie tutaj zmień i tam.
  const IDF = (()=>{ const pool=[...P, ...R], df={}; for (const x of pool) for (const k in x.wagi) df[k]=(df[k]||0)+1;
    const out={}; for (const k in df) out[k]=Math.log(pool.length/df[k]); return out; })();
  const idf = k => IDF[k] ?? 1;
  const isGen = k => !!(NOTES[k]||{}).gen;
  function noteVec(w){ const out={}; for (const k in w) if (!isGen(k)) out[k]=w[k]*idf(k); return out; }
  function damp(f){ const out={}; for (const k in f) out[k]=Math.sqrt(f[k]); return out; }
  function weightedJaccard(a,b){
    let inter=0, uni=0; const keys=new Set([...Object.keys(a),...Object.keys(b)]);
    for (const k of keys){ const x=a[k]||0, y=b[k]||0; inter+=Math.min(x,y); uni+=Math.max(x,y); }
    return uni? inter/uni : 0;
  }

    let dot=0, na=0, nb=0;
    for (const k in a){ na+=a[k]*a[k]; if (b[k]) dot+=a[k]*b[k]; }
    for (const k in b) nb+=b[k]*b[k];
    return (na&&nb)? dot/Math.sqrt(na*nb) : 0;
  }
  function scaleSim(a,b){
    if ([a.slodycz,a.swiezosc,a.ciezkosc,b.slodycz,b.swiezosc,b.ciezkosc].some(v=>v==null)) return 0.5;
    const d = Math.abs(a.slodycz-b.slodycz)+Math.abs(a.swiezosc-b.swiezosc)+Math.abs(a.ciezkosc-b.ciezkosc);
    return 1 - d/12;
  }
  function genderFactor(want, have){
    if (!want || want==='*' || want==='?' || have==='?' ) return 1;
    if (want==='U') return have==='U'?1:0.85;
    if (have==='U' || have===want) return 1;
    return 0.6;
  }
  function similarity(seed, p){
    const nj = weightedJaccard(noteVec(seed.wagi), noteVec(p.wagi));
    const fc = cosine(damp(seed.rodziny), damp(p.rodziny));
    const sc = scaleSim(seed, p);

    let penalty = 1;
    if (seed.slodycz!=null && p.slodycz!=null){

    }
    return { total: Math.max(0,(0.40*nj + 0.35*fc + 0.25*sc)*penalty), nj, fc, sc };
  }
  function sharedNotes(seed, p){
    // Najpierw nuty najbardziej charakterystyczne (rzadkie), nie „piżmo, wanilia”.
    return Object.keys(seed.wagi).filter(k=>p.wagi[k] && !isGen(k)).sort((a,b)=>(p.wagi[b]+seed.wagi[b])*idf(b)-(p.wagi[a]+seed.wagi[a])*idf(a));
  }
  function sharedFamilies(seed, p){
    return Object.keys(seed.rodziny).filter(f=>p.rodziny[f] && f!=='slodki').sort((a,b)=>(p.rodziny[b]*seed.rodziny[b])-(p.rodziny[a]*seed.rodziny[a]));
  }
  const SW = EN ? ['','dry','slightly sweet','moderately sweet','sweet','very sweet (gourmand)'] : ['','wytrawny','lekko słodki','umiarkowanie słodki','słodki','bardzo słodki (gourmand)'];
  const FW = EN ? ['','warm, enveloping','rather warm','balanced','rather fresh','very fresh'] : ['','ciepły, otulający','raczej ciepły','zbalansowany','raczej świeży','bardzo świeży'];
  const HW = EN ? ['','very light','light','medium strength','bold','heavy, evening'] : ['','bardzo lekki','lekki','o średniej mocy','wyrazisty','ciężki, wieczorowy'];
  function compareScales(seed,p){
    if ([seed.slodycz,p.slodycz].some(v=>v==null)) return '';

  function rangeFit(v, range){
    if (!range || v==null) return {fit:1, active:false};
    const [lo,hi]=range.split('-').map(Number);
    if (v>=lo && v<=hi) return {fit:1, active:true};
    const d = v<lo? lo-v : v-hi; return {fit:Math.max(0,1-d/2), active:true};
  }
  function listFit(have, wanted, map){

    for (const w of wanted){ if (map[w].some(k=>haveF.some(h=>h.includes(k)))) hits.push(w); }

  }

    if (!ranked.length) html+=emptyCard(T('Nic nie pasuje do wszystkich kryteriów.','Nothing matches all criteria.'), T('Poluzuj filtr „nie lubię” albo zdejmij ograniczenie dostępności.',"Relax the “don't like” filter or turn off the in-stock restriction."));
    else {
      html += sec(T('Propozycje','Suggestions'), inStock.length, T('Dostępne od ręki, w kolejności dopasowania do kryteriów.','In stock, ordered by how well they match your criteria.'));
      if (!inStock.length) html += emptyCard(T('Brak dostępnych pozycji spełniających kryteria.','No in-stock items match the criteria.'), T('Zobacz pozycje obecnie niedostępne poniżej albo poluzuj kryteria.','See the items currently out of stock below, or relax the criteria.'));
      html += inStock.map(advCard).join('');
      if (outStock.length) html += outSec(outStock.length) + outStock.map(advCard).join('');
    }
    out.innerHTML=html; bindCards(out);
  }
  function whyAdvise(r){
    const p=r.p; const rows=[];
    const occText = esc(listText(p.okazje, p.okazje_tekst)), seaText = esc(listText(p.pory_roku, p.pory_roku_tekst));
    if (p.slodycz!=null) rows.push([T('Profil','Profile'), `${SW[p.slodycz]}, ${FW[p.swiezosc]}, ${HW[p.ciezkosc]}`]);
    if (r.fn.active){
      const v=[];
      if (r.fn.hits.length) v.push(`${T('Zawiera','Contains')} <b>${esc(r.fn.hits.map(noteName).join(', '))}</b> – ${T('nuty, których szukasz.','the notes you are looking for.')}`);
      if (r.fn.famHits.length) v.push(`${T('Zamiast','Instead of')} „${esc(r.fn.famHits.map(noteName).join(', '))}” ${T('daje pokrewny akord.','it offers a related accord.')}`);
      if (!r.fn.hits.length && !r.fn.famHits.length) v.push(`<span class="muted">${T('Nie ma wskazanych nut – pasuje profilem.','Does not contain the requested notes – matches by profile.')}</span>`);
      rows.push([T('Nuty','Notes'), v.join(' ')]);
    }
    if (r.fo.active) rows.push([T('Okazje','Occasions'), r.fo.hits.length ? occText : `<span class="muted">${T('Polecany raczej na','Better suited to')}: ${occText}</span>`]);
    if (r.fse.active) rows.push([T('Pora roku','Season'), r.fse.hits.length ? seaText : `<span class="muted">${T('Polecany raczej na','Better suited to')}: ${seaText}</span>`]);
    return whyRows(rows);
  }

  // ---------- KATALOG / SZUKAJ ----------
  const brands=[...new Set(P.map(p=>p.marka).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
  $('#sBrand').innerHTML += brands.map(b=>`<option>${esc(b)}</option>`).join('');
  // Tekst do wyszukiwania w obu językach: „truskawk” i „strawberry” znajdują te same pozycje.
  const searchText = p => fold([p.nazwa,p.marka,p.plec,p.inspiracja,p.inspiracja_en,p.rodzina,p.akordy,p.nuty_glowy,p.nuty_serca,p.nuty_bazy,p.okazje_tekst,p.pory_roku_tekst,
    Object.values(p.nuty_ids).flat().map(id=>NOTES[id].en).join(' '), GENDER_EN[p.plec_kod]].join(' | '));
  P.forEach(p=>p._txt=searchText(p));
  function runSearch(){
    const q=fold($('#sInput').value), g=$('#sGender').value, b=$('#sBrand').value, sort=$('#sSort').value, st=$('#sStock').checked;
    const toks=q.split(' ').filter(Boolean);
    const rows=P.filter(p=> toks.every(t=>p._txt.includes(t)) && (g==='*'||p.plec_kod===g) && (!b||p.marka===b) && (!st||p.na_stanie));
    const byName = (a,b)=>a.nazwa.localeCompare(b.nazwa,'pl');
    rows.sort({name:byName, stock:(a,b)=>(b.na_stanie-a.na_stanie)||byName(a,b), sweet:(a,b)=>b.slodycz-a.slodycz, fresh:(a,b)=>b.swiezosc-a.swiezosc, heavy:(a,b)=>b.ciezkosc-a.ciezkosc}[sort]);
    $('#sCount').textContent = EN ? `${rows.length} of ${P.length} items` : `${rows.length} z ${P.length} pozycji`;
    const line = p => p.inspiracja && !p.inspiracja_brak ? T('Inspiracja','Inspiration')+': <b>'+esc(inspText(p).split(/ – /)[0])+'</b>' : noInsp(p) ? '' : T('Własna kompozycja','Own composition');
    const scales = p => p.slodycz==null ? '' : EN ? `Sweetness ${p.slodycz} · Freshness ${p.swiezosc} · Weight ${p.ciezkosc}` : `Słodycz ${p.slodycz} · Świeżość ${p.swiezosc} · Ciężkość ${p.ciezkosc}`;
    $('#sOut').innerHTML = rows.map(p=>`<article class="result pcard" data-id="${p.id}">
      <div class="r-id"><h4 class="name">${esc(p.nazwa)}</h4><div class="brand">${brandLine(p)}</div></div>
      ${line(p)?`<p class="insp">${line(p)}</p>`:''}
      <div class="facts">${scales(p)?`<div>${scales(p)}</div>`:''}<div>${esc(rodzina(p))}</div></div>
      <div class="r-foot">${availBadge(p)}${moreBtn(p)}</div>
    </article>`).join('');
    if (!rows.length){
      const filtered = $('#sGender').value!=='*' || $('#sBrand').value || $('#sStock').checked;
      $('#sOut').innerHTML = emptyCard(q ? T(`Brak wyników dla „${esc($('#sInput').value.trim())}”.`, `No results for “${esc($('#sInput').value.trim())}”.`) : T('Brak wyników.','No results.'),
        T('Sprawdź pisownię albo wpisz początek słowa (np. „truskawk”)','Check the spelling or type the start of a word (e.g. “straw”)') + (filtered ? T(' – albo wyczyść filtry.',' – or clear the filters.') : '.'),
        `<div><button type="button" class="btn" id="sClear">${filtered ? T('Wyczyść wyszukiwanie i filtry','Clear search and filters') : T('Wyczyść wyszukiwanie','Clear search')}</button></div>`);
      $('#sClear').addEventListener('click', ()=>{ $('#sInput').value=''; $('#sGender').value='*'; $('#sBrand').value=''; $('#sStock').checked=false; runSearch(); $('#sInput').focus(); });
    }
    bindCards($('#sOut'));
  }
  ['sInput','sGender','sBrand','sSort','sStock'].forEach(id=>$('#'+id).addEventListener('input',runSearch));
  runSearch();

  // ---------- SZCZEGÓŁY ----------
  let lastFocus = null;
  function openDetail(id, from){
    const p=P.find(x=>x.id===id); if (!p) return;
    if (!$('#modalBg').classList.contains('open')) lastFocus = from || document.activeElement;
    const pyr = pyramid(p).map(([l,v])=>`<b>${l}</b><span>${esc(v)}</span>`).join('');
    const simFirst = stockFirst(rankSimilar(p,{gender:'*',exclude:[p.id]}), 5), similar = [...simFirst.inStock, ...simFirst.out];
    const refs = R.map(r=>({r,s:similarity(p,r).total})).sort((a,b)=>b.s-a.s).slice(0,3);
    const conf = !p.pewnosc || p.pewnosc==='—' || p.inspiracja_brak ? '' : `<span class="muted conf-inline">${EN ? 'confidence: '+CONF[confLevel(p)] : 'pewność: '+esc(p.pewnosc)}</span>`;
    $('#modal').innerHTML = `<button type="button" class="close" id="modalClose" aria-label="${T('Zamknij','Close')}"></button>
      <h2 id="modalTitle">${esc(p.nazwa)}</h2><div class="brand">${brandLine(p)}</div>
      <div class="meta">${availBadge(p)}</div>
      <div class="kv">
        <b>${T('Inspiracja','Inspiration')}</b><span>${esc(inspText(p)||'—')}${conf}</span>
        <b>${T('Rodzina','Family')}</b><span>${esc(rodzina(p))}</span>
        <b>${T('Akordy','Accords')}</b><span>${esc(akordy(p))}</span>
        <b>${T('Okazje','Occasions')}</b><span>${esc(listText(p.okazje, p.okazje_tekst)||'—')}</span>
        <b>${T('Pory roku','Seasons')}</b><span>${esc(listText(p.pory_roku, p.pory_roku_tekst)||'—')}</span>
      </div>
      ${sec(T('Piramida nut','Note pyramid'))}<div class="pyr">${pyr}</div>
      ${sec(T('Skale','Scales'))}${bars(p)}
      ${sec(T('Podobne w katalogu','Similar in the catalog'), null, simFirst.out.length ? T('Najpierw dostępne od ręki; wyszarzone – obecnie niedostępne.','In stock first; dimmed – currently out of stock.') : T('Podobieństwo profilu zapachowego.','Scent profile similarity.'))}<div class="chips">${similar.map(r=>`<button type="button" class="chip${r.p.na_stanie?'':' unavail'}" data-open="${r.p.id}"${r.p.na_stanie?'':` title="${T('Obecnie niedostępny','Currently out of stock')}"`}>${esc(r.p.nazwa)} · ${Math.round(r.score*100)}%</button>`).join('')}</div>
      ${sec(T('Najbliższe zapachy projektanckie','Closest designer fragrances'), null, T('Według profilu nut, nie deklarowanej inspiracji.','By note profile, not by stated inspiration.'))}<div class="chips">${refs.map(x=>`<span class="chip small note">${esc(x.r.nazwa)} · ${Math.round(x.s*100)}%</span>`).join('')}</div>`;
    $('#modalBg').classList.add('open'); document.body.style.overflow='hidden';
    $('#modalBg').scrollTop = 0;
    $('#modalClose').addEventListener('click',closeDetail);
    $$('[data-open]',$('#modal')).forEach(c=>c.addEventListener('click',()=>openDetail(+c.dataset.open)));
    $('#modalClose').focus();
  }
  function closeDetail(){
    if (!$('#modalBg').classList.contains('open')) return;
    $('#modalBg').classList.remove('open'); document.body.style.overflow='';
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  $('#modalBg').addEventListener('click',e=>{ if (e.target.id==='modalBg') closeDetail(); });
  document.addEventListener('keydown',e=>{ if (e.key==='Escape') closeDetail(); });

  // Start: przykład
  $('#refInput').value='Fahrenheit';
  // Wersja hostowana (https): app/sw.js trzyma kopię offline. Plik otwarty z dysku (file:) działa bez tego.
  try { if (location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{}); } catch (e) {}
})();
</script>
</body>
</html>
